const escapeHtml=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e=escapeHtml, iso=()=>new Date().toISOString(), key=r=>`${r.source}:${r.id}`;
const link=(url,label)=>`<a href="${e(/^https?:\/\//i.test(url||'')?url:'#')}" target="_blank" rel="noopener noreferrer">${e(label)} ↗</a>`;
const canonical=r=>(r.doi||((r.url||'').startsWith('https://doi.org/')?r.url.slice(16):r.url?.replace(/\/$/,''))||key(r)).toLowerCase();
const unique=items=>{const map=new Map();for(const r of items){const id=r.url?.replace(/\/$/,'')||key(r);if(!map.has(id))map.set(id,r);}return [...map.values()];};
const excerpt=r=>(r.finding||r.abstract||r.summary||'초록이 없습니다. 원출처를 확인하세요.').slice(0,900);
function topicOf(text){
 if(/potassium|hyperkal|bleed|safety|칼륨|출혈|안전|monitor/i.test(text))return topics[1];
 if(/quality.of.life|patient.report|access|barrier|삶의 질|환자 경험|접근성/i.test(text))return topics[2];
 if(/guideline|implementation|subgroup|asian|gap|적용|하위|가이드/i.test(text))return topics[3];
 return /outcome|trial|efficacy|효과|결과/i.test(text)?topics[0]:topics[4];
}
function normalize(r,kind='paper',stamp=iso()){return {...r,kind,id:String(r.id),source:r.source||'확인 문헌',retrieved_at:r.retrieved_at||stamp,topic:r.topic||topicOf(r.title||''),access:r.access||(kind==='trial'?'등록정보 · 결과/허가와 구분':'초록 / 서지정보 · 원문 검토 필요')};}

function bars(rows,total,label){return `<div class="cv-chart" role="img" aria-label="${e(label)}">${rows.map(([l,n])=>`<div class="cv-bar"><span>${e(l)}</span><div><i style="width:${total?Math.round(n/total*100):0}%"></i></div><b>${n}${total?` · ${Math.round(n/total*100)}%`:''}</b></div>`).join('')}${total?'':'<p class="cv-empty">아직 집계할 기록이 없습니다.</p>'}</div>`;}
function evidenceTable(items){return `<div class="cv-table-wrap"><table><thead><tr><th>문서 / 출처</th><th>대상 · 설계</th><th>결과 / 검토할 내용</th></tr></thead><tbody>${items.map(r=>`<tr><td>${link(r.url,r.title)}<small>${e(key(r))} · ${e(r.date||r.updated_date||'')}</small></td><td>${e(r.population||r.conditions?.join(', ')||r.type||r.status||'원문 확인')}<small>${e(r.access)}</small></td><td>${e(excerpt(r))}${r.limit?`<p class="cv-caution">${e(r.limit)}</p>`:''}</td></tr>`).join('')}</tbody></table></div>`;}
function companyNotes(){return `<section class="cv-card cv-company-notes"><details><summary><h2>Bayer의 AI·Medical 활용, 어디까지 확인됐나</h2><p class="cv-muted">글로벌과 한국의 공개 사례 · 2026-11-14 확인</p></summary><p class="cv-caution">아래 자료에서는 한국바이엘 의학부의 도구 목록·사용률을 확인할 수 없습니다. MSL ONE은 독립 포트폴리오이며 myGenAssist·Veeva에 연결되어 있지 않습니다.</p><div class="cv-context-grid">${companyContext.map(c=>`<article><span class="cv-pill">${e(c.scope)} · ${c.id}</span><h3>${e(c.title)}</h3><p>${e(c.finding)}</p><p class="cv-muted">${e(c.limit)}</p><small>${e(c.date)} · ${link(c.url,'출처')}</small></article>`).join('')}</div></details></section>`;}
function reviewLog(m,stage){const logs=(m.reviewLogs||[]).filter(r=>r.stage===stage);return `<section class="cv-card cv-review-log"><h2>확인하고 수정한 기록</h2><p class="cv-muted">사용자가 남긴 검토 기록입니다. 전문 메디컬 검토나 조직 승인을 대신하지 않습니다.</p>${logs.length?logs.map(r=>`<article class="cv-review-entry"><span class="cv-pill">${e(r.origin)} · ${e(r.decision)} · ${e(r.at)}</span><h3>${e(r.claim)}</h3><div class="cv-two-columns"><div><small>검토 전 초안</small><p>${e(r.before)}</p></div><div><small>검토 후 문장</small><p>${e(r.after)}</p></div></div><dl><div><dt>확인한 내용</dt><dd>${e(r.reason)}</dd></div><div><dt>검토 범위</dt><dd>${e(r.access)}</dd></div><div><dt>검토자</dt><dd>${e(r.reviewer)}</dd></div><div><dt>남은 확인 / 후속 질문</dt><dd>${e(r.followup||'작성하지 않음')}</dd></div></dl>${r.source?`<p>${link(r.source.url,r.source.title)}<small>${e(key(r.source))} · ${e(r.source.retrieved_at||'')}</small></p>`:'<p class="cv-caution">연결 출처 없음 · 보류 기록</p>'}</article>`).join(''):'<p class="cv-empty">아직 저장한 검토 기록이 없습니다.</p>'}</section>`;}
function checkedReview(d,source,stage){
 if(!d.claim?.trim()||!d.before?.trim()||!d.reason?.trim()||!d.reviewer?.trim())throw Error('검토할 주장·초안·확인한 내용·검토자를 입력하세요.');
 if(d.decision!=='보류'&&(!source||!d.after?.trim()||d.access==='출처 미확인'))throw Error('채택 또는 수정 기록에는 확인 출처·검토 범위·검토 후 문장이 필요합니다.');
 return {...d,stage,at:iso(),source:source?{...source}:null};
}
function resultMap(items){return `<div class="cv-result-grid">${items.map(r=>`<article class="cv-result-card"><span class="cv-pill">${e(r.id)} · ${e(r.type||'초록 검토')}</span><h3>${e(r.title)}</h3><div class="cv-result-flow"><div><small>연구 대상</small><p>${e(r.population||'초록의 대상군과 선정 기준 확인')}</p></div><div><small>설계</small><p>${e(r.type||'원문에서 설계 확인')}</p></div><div><small>결과 / 평가변수</small><p>${e(r.finding||'아래 초록에서 평가변수와 결과를 확인하세요.')}</p></div></div>${r.id==='E01'?`<figure class="cv-effect"><figcaption>FIDELIO-DKD · 주 신장 복합평가변수</figcaption><div class="cv-effect-axis"><i class="cv-null"></i><i class="cv-ci"></i><b class="cv-point"></b></div><div class="cv-effect-labels"><span>HR 0.50</span><span>1.00</span><span>1.20</span></div><p>HR 0.82 · 95% CI 0.73–0.93<br><small>finerenone vs placebo · 해당 연구 내 비교</small></p></figure>`:''}<p class="cv-muted">${e(r.limit||'원문에서 안전성·제한점·추가 분석을 확인하세요.')}</p>${link(r.url,'근거 확인')}</article>`).join('')}</div>`;}
function preReport(m){
 const papers=m.basket.filter(r=>r.kind==='paper'),trials=m.basket.filter(r=>r.kind==='trial');
 return `<section class="cv-report-section"><p class="cv-kicker">BEFORE THE VISIT</p><h2>방문 전 브리핑</h2><p>${e(m.hcp.name)} · ${e(m.hcp.hospital)} · ${e(m.hcp.department)} · ${e(m.hcp.product)}</p><div class="cv-stats">${stat(papers.length,'선택 논문')}${stat(trials.length,'선택 임상')}${stat(m.questions.length,'준비한 질문')}</div><div class="cv-report-grid"><article class="cv-card"><h3>선택 문서의 주제</h3>${bars(group(m.basket,r=>r.topic),m.basket.length,'선택 문서의 제목 기준 주제 분류')}<p class="cv-muted">제목 단어로 분류한 건수입니다. 치료 효과나 전체 연구 비율이 아닙니다.</p></article><article class="cv-card"><h3>근거를 읽는 순서</h3><div class="cv-process"><span>대상군</span><i>→</i><span>설계</span><i>→</i><span>평가변수</span><i>→</i><span>효과 · 안전성</span></div><p>대상군과 진료 환경의 차이, 안전성 자료, 상충하는 결과를 함께 확인합니다.</p></article></div><h3>논문</h3>${papers.length?evidenceTable(papers):'<p class="cv-empty">논문을 장바구니에 담아주세요.</p>'}<h3>임상 등록정보</h3>${trials.length?evidenceTable(trials):'<p class="cv-empty">담긴 임상 등록정보가 없습니다.</p>'}<h3>과학적 방문 목적</h3><p>${e(m.visitPurpose||'미작성')}</p><h3>확인할 질문</h3><p style="white-space:pre-wrap">${e(m.visitObjectives||'미작성')}</p><h3>답변 준비 초안</h3><p>${e(m.preparationResult?.ai?.answer||'아직 생성하지 않았습니다.')}</p><h3>내가 준비한 질문</h3>${m.questions.length?m.questions.map(q=>`<article class="cv-question"><span>${e(q.topic)} · ${e(q.source||'출처 미연결')}</span><p>${e(q.text)}</p></article>`).join(''):'<p class="cv-empty">방문 전 탭에서 질문을 직접 작성하세요.</p>'}</section>`;
}
const originalPreReport=preReport;
function visualPreReport(m){const html=originalPreReport(m);return html.replace('<h3>논문</h3>',`<h3>연구 결과를 읽는 지도</h3>${resultMap(m.basket.filter(r=>r.kind==='paper'))}<h3>논문</h3>`);}
function postReport(m){return `<section class="cv-report-section"><p class="cv-kicker">AFTER THE VISIT</p><h2>질문 · insight 리포트</h2><p>직접 입력·음성 변환·연습 자료를 구분해 확인하세요. 공개 HCP의 실제 발언으로 임의 귀속하지 않습니다.</p><div class="cv-stats">${stat(m.visits.length,'저장한 교류 기록')}${stat(m.visits.filter(v=>v.insight).length,'검토할 insight')}${stat(m.review?.papers?.items?.length||0,'후속 검색 논문')}</div><article class="cv-card"><h3>어떤 분야의 질문이 많았나</h3>${bars(group(m.visits,r=>r.topic),m.visits.length,'사용자가 지정한 질문 분야별 건수와 비율')}<p class="cv-muted">저장한 기록의 분야별 건수입니다. 전체 HCP 수요로 일반화하지 않습니다.</p></article>${m.visits.map((v,i)=>`<article class="cv-card"><span class="cv-pill">${v.mode==='user-recorded transcript'?'음성 기록':'연습 기록'} ${i+1} · ${e(v.topic)} · ${e(v.at)}</span><h3>${e(v.question)}</h3>${v.transcript?`<details class="cv-accordion"><summary>CC 자막 기록 · ${v.transcriptOrigin==='practice'?'연습 예제':'음성인식 결과'}</summary><p>${e(v.transcript)}</p></details>`:''}${v.questionAnalysis?.status==='ok'?`<details class="cv-accordion"><summary>저장 당시 LLM 질문 분석</summary>${questionAnalysisMarkup(v.questionAnalysis)}</details>`:''}<dl>${[['observation','관찰'],['interpretation','해석'],['hypothesis','가설'],['insight','insight 후보'],['followup','후속 조치']].map(([k,l])=>`<div><dt>${l}</dt><dd>${e(v[k]||'작성하지 않음')}</dd></div>`).join('')}</dl><p class="cv-muted">연결 근거: ${e((v.sourceIds||[]).join(', ')||'없음')} · 검토 전</p></article>`).join('')}${m.review?`<h3>후속 근거 정리</h3><p>${e(m.review.query)} · ${e(m.review.retrieved_at)} · ${e(m.review.origin)}</p>${evidenceTable([...(m.review.papers?.items||[]),...(m.review.trials?.items||[])])}<p class="cv-caution">초록·등록정보를 모은 목록입니다. 임상적 의미는 원문 검토 후 판단하세요.</p>${(m.review.news?.items||[]).map(n=>`<p>${link(n.url,n.title)} · ${e(n.date)} · ${e(n.source||'확인 기사')}</p>`).join('')}`:''}</section>`;}
function reportBody(m,part='all'){return `<div class="cv-export-header"><h1>MSL ONE / CVRM</h1><p>독립 포트폴리오 · ${e(iso())} · Bayer 공식 도구 아님</p></div>${part!=='post'?visualPreReport(m)+reviewLog(m,'pre'):''}${part!=='pre'?postReport(m)+reviewLog(m,'post'):''}<footer class="cv-report-footer">GCP 참고 원칙: 식별정보 최소화 · 출처와 검색 시점 추적 · 관찰과 해석 분리 · 검토 책임 명시. ${link(sources.find(s=>s.id==='G01').url,'ICH E6(R3)')}<br>교육용 초안이며 GCP 인증·의학적 조언·국내 허가 검증을 의미하지 않습니다.</footer>`;}

function mountDemo(root,initialLang='kr',options={}){
 let m=initialModel(initialLang);try{const s=JSON.parse(localStorage.getItem('msl-cvrm-v2')||'null');if(s?.version===2&&Array.isArray(s.basket)&&Array.isArray(s.visits))m={...m,...s,papers:m.papers,trials:m.trials,lang:initialLang};}catch{/* clean start */}
 let preparationTab='pre',libraryView='results',visitView='results',speechCapture=null,speechState='idle',speechInterim='',llmKeyDraft='',llmModelDraft='gpt-6-luna',llmConnected=false;
 const Recognition=options.SpeechRecognition||(typeof window!=='undefined'&&(window.SpeechRecognition||window.webkitSpeechRecognition));
 let tab='dashboard',message='',busy='',libraryMode='saved',reportMode='pre',page=1,active=true,newsFilter='all',newsExpanded=false,articleLoading=new Set(),articleSummaries={},drawer='',newsId='',lastToast='',toastTimer,returnFocus=null;
 const defaultNewsQuery='(Bayer OR 바이엘) (finerenone OR cardiovascular OR 심혈관) when:30d';
 if(m.newsQuery===defaultNewsQuery)m.newsQuery='';
 const t=(kr,en)=>m.lang==='en'?en:kr;
 const byId=id=>[...m.papers,...m.trials,...m.hcpPapers,...m.basket,...(m.searchMeta?.papers.items||[]),...(m.searchMeta?.trials.items||[]),...(m.review?.papers?.items||[]),...(m.review?.trials?.items||[])].find(r=>key(r)===id);
 function persist(){try{localStorage.setItem('msl-cvrm-v2',JSON.stringify(m));}catch{message='저장하지 못했습니다. 리포트를 HTML로 내보내세요.';}}
 function reportLabel(r){return isFidelio(r)?'FIDELIO-DKD':r.kind==='trial'?r.id:r.title.slice(0,28);}
 function isFidelio(r){return r.kind!=='trial'&&(r.id==='E01'||r.id==='33264825'||/10\.1056\/NEJMoa2025845/i.test(r.doi||r.url||''));}
 function reportItems(owner){const field=owner==='visit'?'hcpStudyReports':'studyReports';if(!Array.isArray(m[field]))m[field]=[];return m[field];}
 function addStudyReport(r,owner=tab==='visit'?'visit':'library'){const items=reportItems(owner),existing=items.find(x=>canonical(x)===canonical(r)||isFidelio(x)&&isFidelio(r));if(existing)return key(existing);items.push({...r,reportCreated:iso()});persist();return key(r);}
 function libraryTabs(owner='library'){const view=owner==='visit'?visitView:libraryView,attr=owner==='visit'?'data-visit-report':'data-library-report',prefix=owner==='visit'?'cv-visit':'cv-lib';return `<div class="cv-library-tabs" role="tablist" aria-label="${owner==='visit'?'HCP 자료와 리포트':'검색과 문서 리포트'}"><button role="tab" id="${prefix}-results" aria-selected="${view==='results'}" tabindex="${view==='results'?0:-1}" aria-controls="${owner==='visit'?'cv-visit-panel':'cv-library-panel'}" ${attr}="results">${owner==='visit'?'HCP 방문 준비':'검색 결과'}</button>${reportItems(owner).map((r,i)=>`<span class="cv-report-tab ${view===key(r)?'is-active':''}"><button role="tab" id="${prefix}-report-${i}" aria-controls="${owner==='visit'?'cv-visit-panel':'cv-library-panel'}" aria-selected="${view===key(r)}" tabindex="${view===key(r)?0:-1}" ${attr}="${e(key(r))}"><span>리포트</span> ${e(reportLabel(r))}</button><button type="button" class="cv-tab-close" data-close-study="${e(key(r))}" data-report-owner="${owner}" aria-label="${e(reportLabel(r))} 리포트 닫기">×</button></span>`).join('')}</div>`;}
 function closeStudyReport(id,owner){const field=owner==='visit'?'hcpStudyReports':'studyReports';m[field]=reportItems(owner).filter(r=>key(r)!==id);if(owner==='visit'&&visitView===id)visitView='results';if(owner==='library'&&libraryView===id)libraryView='results';persist();render();root.querySelector(owner==='visit'?'#cv-visit-results':'#cv-lib-results')?.focus();}
 function selectedStudyReport(owner='library'){const view=owner==='visit'?visitView:libraryView,items=reportItems(owner),r=items.find(x=>key(x)===view),prefix=owner==='visit'?'cv-visit':'cv-lib';return `<section class="cv-inline-review cv-panel-scroll" role="tabpanel" id="${owner==='visit'?'cv-visit-panel':'cv-library-panel'}" aria-labelledby="${prefix}-report-${items.indexOf(r)}"><div class="cv-heading"><p class="cv-kicker">EVIDENCE REVIEW REPORT</p><button ${owner==='visit'?'data-visit-report':'data-library-report'}="results">${owner==='visit'?'HCP 방문 준비로 돌아가기':'검색 결과로 돌아가기'}</button></div>${r?isFidelio(r)?inlineReviewCase():sourceReview(r):'<p>검색 결과에서 문서를 선택하세요.</p>'}</section>`;}
 function sourceReview(r){return `<article class="cv-completed-case"><h2>${e(r.title)}</h2><p class="cv-caution">${r.kind==='trial'?'임상 등록정보':'초록·서지정보'} 기반 검토 초안 · 원문 검토 전</p><div class="cv-review-bento">${[['01 · 대상 환자·연구 설계',r.population||r.conditions?.join(', ')||r.type||'원출처에서 대상군과 설계를 확인하세요.'],['02 · 주요 효과 결과와 도식',excerpt(r)],['03 · 안전성','수치와 평가 기준을 원문에서 확인해야 합니다.'],['04 · 한계와 적용 범위',r.limit||'선정 기준·비교군·추적 기간과 적용 범위를 확인해야 합니다.'],['05 · HCP 토론 질문 3개','① 실제 진료 환자군과 연구 대상은 어떻게 다른가요? ② 안전성 모니터링에서 어려운 점은 무엇인가요? ③ 추가로 확인할 근거는 무엇인가요?'],['06 · 원문 출처와 검토 범위',`${r.source} · ${r.id} · ${r.access} · 확인 ${r.retrieved_at}`]].map(([h,p])=>`<section class="cv-card"><h3>${h}</h3><p>${e(p)}</p></section>`).join('')}</div><p>${link(r.url,'원출처 확인')}</p><p class="cv-muted">수치 도식은 검증된 구조화 결과가 있을 때 표시합니다. 빈 안전성·한계 항목을 임의 생성하지 않습니다. 질문은 토론용 예시입니다.</p></article>`;}
 const btn=(a,l,c='')=>`<button type="button" class="${c}" data-action="${a}" ${busy&&['search','hcp-search','review','news','question-analyze','llm-connect'].includes(a)?'disabled':''}>${l}</button>`;
 function record(r,basket=false){const selected=m.basket.some(b=>canonical(b)===canonical(r));return `<article class="cv-document"><details><summary><span class="cv-pill">${e(r.source)} · ${e(r.id)}</span><h3>${e(r.title)}</h3><small>${e(r.date||r.updated_date||'')} · ${e(r.type||r.status||r.kind)}</small></summary><div class="cv-document-body"><p>${e(r.population||r.conditions?.join(', ')||'')}</p><p class="cv-excerpt">${e(excerpt(r))}</p>${r.limit?`<p class="cv-caution">${e(r.limit)}</p>`:''}${r.authors?.length?`<p>${e(r.authors.join(', '))}</p>`:''}${r.affiliations?.length?`<details><summary>저자 소속 확인</summary><p>${e(r.affiliations.join(' / '))}</p></details>`:''}${r.author?`<p>${e(r.author)}</p>`:''}<p>${link(r.url,'원출처')} · ${e(r.access)}</p><small>확인 시점: ${e(r.retrieved_at)}</small><p>${e(r.note||'초록·등록정보와 원문을 구분해 검토하세요.')}</p></div></details><button class="cv-pick ${selected?'is-selected':''}" data-pick="${e(key(r))}" aria-pressed="${selected}">${basket?'빼기':selected?'담김 ✓':'+ 담기'}</button><button class="cv-make-report" data-study-report="${e(key(r))}">리뷰 리포트 생성</button></article>`;}
